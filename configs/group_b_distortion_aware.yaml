extends: base.yaml
experiment:
  name: group_b_distortion_aware_classical
  description: Distortion-aware enhancement + full handcrafted feature set + RF/LightGBM
  group: B
preprocessing:
  type: distortion_aware
features:
  modules:
  - trajectory
  - circular_motion
  - kinematics
  - shape
  - wavelet
  - interaction
models:
  active:
  - name: random_forest_sklearn
    params:
      n_estimators: 200
      max_depth: null
      class_weight: balanced
  - name: lightgbm
    params:
      n_estimators: 200
      max_depth: 6
      learning_rate: 0.1
